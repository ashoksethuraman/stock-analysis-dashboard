name: Deploy Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify deployment configuration
        run: |
          echo "=========================================="
          echo "Deployment Configuration"
          echo "=========================================="
          echo "App Name       : stock-analyse"
          echo "Resource Group : rg-stock-analysis"
          echo "Node Version   : 24"
          echo "Branch         : ${GITHUB_REF_NAME}"
          echo "Commit         : ${GITHUB_SHA}"
          echo "Repository     : ${GITHUB_REPOSITORY}"
          echo "Environment    : production"
          echo "=========================================="
          echo "AZURE_CLIENT_ID is configured: ${{ secrets.AZURE_CLIENT_ID != '' }}"
          echo "AZURE_TENANT_ID is configured: ${{ secrets.AZURE_TENANT_ID != '' }}"
          echo "AZURE_SUBSCRIPTION_ID is configured: ${{ secrets.AZURE_SUBSCRIPTION_ID != '' }}"
          echo "=========================================="

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build Next.js application
        run: npm run build

      - name: Verify Next.js standalone build
        run: |
          echo "=========================================="
          echo "Next.js Build Verification"
          echo "=========================================="

          echo ""
          echo "Root .next:"
          ls -la .next

          echo ""
          echo "Standalone:"
          ls -la .next/standalone

          echo ""
          echo "Standalone .next:"
          ls -la .next/standalone/.next

          echo ""
          echo "Standalone files:"
          find .next/standalone -maxdepth 3 -type f | head -100

          echo ""
          echo "=========================================="

      - name: Prepare deployment package
        run: |
          echo "Preparing deployment package..."

          rm -rf deploy
          mkdir -p deploy

          # Copy complete standalone output
          cp -r .next/standalone/. deploy/

          # Copy static assets required by Next.js
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static

          # Copy public assets
          if [ -d public ]; then
            cp -r public deploy/public
          fi

          echo "=========================================="
          echo "Deployment Package"
          echo "=========================================="

          echo "Root:"
          ls -la deploy

          echo ""
          echo ".next:"
          find deploy/.next -maxdepth 3 -type f | head -100

          echo ""
          echo "server.js:"
          ls -lh deploy/server.js

          echo "=========================================="

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          echo "=========================================="
          echo "Azure Login Successful"
          echo "=========================================="

          az account show \
            --query "{Subscription:name, SubscriptionId:id, TenantId:tenantId}" \
            --output table

          echo "=========================================="

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: stock-analyse
          package: deploy

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Azure App Service Deployment Completed"
          echo "=========================================="
          echo "App Name : stock-analyse"
          echo "URL      : ${{ steps.deploy.outputs.webapp-url }}"
          echo "Branch   : ${GITHUB_REF_NAME}"
          echo "Commit   : ${GITHUB_SHA}"
          echo "=========================================="
